spring.application.name=workshop-service
server.port=8082
spring.web.error.include-message=always
spring.datasource.url=jdbc:h2:mem:workshops
spring.jpa.show-sql=true
spring.h2.console.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true


# Timeouts for calls to fabric-service (milliseconds)
spring.cloud.openfeign.client.config.fabric-service.connect-timeout=1000
spring.cloud.openfeign.client.config.fabric-service.read-timeout=2000

# Circuit breaker for fabric-service
resilience4j.circuitbreaker.instances.fabric-service.sliding-window-size=4
resilience4j.circuitbreaker.instances.fabric-service.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.fabric-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.fabric-service.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.fabric-service.permitted-number-of-calls-in-half-open-state=1
resilience4j.timelimiter.instances.fabric-service.timeout-duration=3s